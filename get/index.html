<script>
  // Send phones straight to their store; everyone else lands on the homepage's download section.
  // Runs before first paint so phones never see this page.
  (function () {
    var ua = navigator.userAgent || "";
    var android = /Android/.test(ua);
    var ios = !android && (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1));
    var target = android ? "https://play.google.com/store/apps/details?id=com.dervlabs.strictlybyiv"
      : ios ? "https://apps.apple.com/app/id6761930760"
      : "/#download";
    location.replace(target);
  })();
</script>
